apiVersion: v1
kind: ConfigMap
metadata:
  name: huyperfume-config
  namespace: huyperfume
data:
  NODE_ENV: "production"
  PORT: "4000"
  CORS_ORIGIN: "https://huyperfume.com"
  DB_HOST: "sqlserver.huyperfume.svc.cluster.local"
  DB_PORT: "1433"
  DB_NAME: "huyperfume"
  REDIS_URL: "redis://redis:6379"
  PRODUCT_CACHE_TTL_SECONDS: "300"
  CHECKOUT_RESERVATION_TTL_SECONDS: "900"
  CHECKOUT_LOCK_TTL_MS: "10000"
  LOW_STOCK_THRESHOLD: "5"
  AUTH_EXPOSE_DEV_TOKENS: "false"
  APP_BASE_URL: "https://huyperfume.com"
  DEEPSEEK_BASE_URL: "https://api.deepseek.com"
  RUN_MIGRATIONS: "false"
