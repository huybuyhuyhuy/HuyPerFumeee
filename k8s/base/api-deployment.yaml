apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: huyperfume
  labels:
    app: huyperfume
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: huyperfume-api
  template:
    metadata:
      labels:
        app: huyperfume-api
        tier: backend
    spec:
      containers:
        - name: api
          image: ghcr.io/huybuyhuyhuy/huyperfume-api:latest
          ports:
            - containerPort: 4000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: huyperfume-config
            - secretRef:
                name: huyperfume-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: uploads
              mountPath: /app/public/uploads
      volumes:
        - name: logs
          emptyDir: {}
        - name: uploads
          persistentVolumeClaim:
            claimName: huyperfume-uploads
