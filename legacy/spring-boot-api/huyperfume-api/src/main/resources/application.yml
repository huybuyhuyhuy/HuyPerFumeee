spring:
  datasource:
    url: jdbc:mysql://localhost:3306/huyperfume?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1800000
      pool-name: HuyPerfumePool

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: true
    properties:
      hibernate:
        format_sql: true

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    timeout: 3000ms

  cache:
    type: redis
    redis:
      time-to-live: 300000

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Ho_Chi_Minh

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:huyperfume-jwt-secret-key-change-in-production-must-be-at-least-256-bits}
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
  momo:
    partner-code: MOMO
    access-key: ${MOMO_ACCESS_KEY:F8BBA842ECF85}
    secret-key: ${MOMO_SECRET_KEY:K951B6PE1waDMi640xX08PD3vg6EkVlz}
    create-endpoint: https://test-payment.momo.vn/v2/gateway/api/create
    use-node-proxy: false
    node-payment-url: http://127.0.0.1:5000/payment
    node-refund-url: http://127.0.0.1:5000/refund
    min-amount-vnd: 10000
    store-id: MomoTestStore
    partner-name: HuyPerfume
    request-type: payWithMethod
    lang: vi
    auto-capture: true
    extra-data: ""
    order-group-id: ""
  zalopay:
    app-id: ${ZALOPAY_APP_ID:2553}
    key1: ${ZALOPAY_KEY1:9phuAOYhan4urywHTh0ndEXiV3pKHr5Q}
    key2: ${ZALOPAY_KEY2:eG4r0GcoNtRGbO8}
    endpoint-create: https://sb-openapi.zalopay.vn/v2/create

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.huyperfume.api.controller

logging:
  level:
    com.huyperfume: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
