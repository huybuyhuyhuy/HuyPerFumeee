spring.application.name=huyperfume-api
server.port=${SERVER_PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# SQL Server 2014 + Windows Authentication
# Defaulting to the common local SQLEXPRESS instance. Override with SPRING_DATASOURCE_URL if needed.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=huyperfume;encrypt=false;integratedSecurity=true;trustServerCertificate=true}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.connection-test-query=SELECT 1

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
