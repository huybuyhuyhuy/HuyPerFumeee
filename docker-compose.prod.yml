version: "3.8"

services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: ghcr.io/huybuyhuyhuy/huyperfume-api:${IMAGE_TAG:-latest}
    container_name: huyperfume-api
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    volumes:
      - api-logs:/app/logs
      - api-uploads:/app/public/uploads
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.5"
    networks:
      - huyperfume-net
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  nginx-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    image: ghcr.io/huybuyhuyhuy/huyperfume-frontend:${IMAGE_TAG:-latest}
    container_name: huyperfume-frontend
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - api
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    networks:
      - huyperfume-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: huyperfume-redis
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --save 900 1 --save 300 10 --save 60 10000 --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always
    networks:
      - huyperfume-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  api-logs:
  api-uploads:
  redis-data:

networks:
  huyperfume-net:
    driver: bridge
